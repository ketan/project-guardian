openapi: 3.1.0
info:
  title: Project Guardian Device API
  version: 0.1.0
  summary: API contract for configuring and monitoring the weather station.
  description: |
    This contract defines the interface between the ESP32-S3 backend and the
    frontend web application. It covers authentication, device configuration,
    live sensor data, retained historical weather data, publisher management,
    and administrative actions such as opening a temporary online window.
tags:
  - name: status
  - name: config
  - name: sensors
  - name: logs
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
          examples: [validation_error]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    DeviceStatusResponse:
      type: object
      additionalProperties: false
      required:
        - device
        - connectivity
        - storage
        - sampling
        - adminWindow
        - sensors
        - publishers
      properties:
        device:
          $ref: '#/components/schemas/DeviceSummary'
        connectivity:
          $ref: '#/components/schemas/ConnectivityStatus'
        storage:
          $ref: '#/components/schemas/StorageStatus'
        sampling:
          $ref: '#/components/schemas/SamplingStatus'
        adminWindow:
          $ref: '#/components/schemas/AdminWindowStatus'
        sensors:
          type: array
          items:
            $ref: '#/components/schemas/SensorStatus'
        publishers:
          type: array
          items:
            $ref: '#/components/schemas/PublisherStatus'
    DeviceSummary:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - firmwareVersion
        - uptimeSeconds
        - currentTime
      properties:
        deviceId:
          type: string
        firmwareVersion:
          type: string
        hardwareModel:
          type: string
        uptimeSeconds:
          type: integer
          minimum: 0
        currentTime:
          type: string
          format: date-time
        lastBootReason:
          type: string
    ConnectivityStatus:
      type: object
      additionalProperties: false
      required:
        - wifi
        - cellular
      properties:
        wifi:
          $ref: '#/components/schemas/WifiStatus'
        cellular:
          $ref: '#/components/schemas/CellularStatus'
    WifiStatus:
      type: object
      additionalProperties: false
      required:
        - enabled
        - active
        - connected
      properties:
        enabled:
          type: boolean
        active:
          type: boolean
        connected:
          type: boolean
        ssid:
          type: string
        ipAddress:
          type: string
        rssiDbm:
          type: integer
    CellularStatus:
      type: object
      additionalProperties: false
      required:
        - enabled
        - active
        - registered
        - modemType
      properties:
        enabled:
          type: boolean
        active:
          type: boolean
        registered:
          type: boolean
        modemType:
          type: string
          examples: [SIM7670G]
        operatorName:
          type: string
        signalQuality:
          type: integer
          minimum: 0
        ipv4:
          type: string
        ipv6:
          type: string
        imei:
          type: string
    StorageStatus:
      type: object
      additionalProperties: false
      required:
        - sdCardPresent
        - retentionDays
      properties:
        sdCardPresent:
          type: boolean
        freeBytes:
          type: integer
          minimum: 0
        usedBytes:
          type: integer
          minimum: 0
        retentionDays:
          type: integer
          minimum: 1
          maximum: 30
        oldestRecordAt:
          type: string
          format: date-time
        newestRecordAt:
          type: string
          format: date-time
    SamplingStatus:
      type: object
      additionalProperties: false
      required:
        - intervalSeconds
        - nextSampleAt
        - lastSampleAt
        - sleepEnabled
      properties:
        intervalSeconds:
          type: integer
          minimum: 2
          maximum: 20
          default: 2
        nextSampleAt:
          type: string
          format: date-time
        lastSampleAt:
          type: string
          format: date-time
        sleepEnabled:
          type: boolean
        smoothingEnabled:
          type: boolean
    AdminWindowStatus:
      type: object
      additionalProperties: false
      required:
        - active
      properties:
        active:
          type: boolean
        openedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        requestedBy:
          type: string
          description: SMS sender number or web user identifier
    SensorStatus:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - enabled
        - healthy
      properties:
        id:
          type: string
        kind:
          type: string
          examples: [sen0658]
        enabled:
          type: boolean
        healthy:
          type: boolean
        lastReadAt:
          type: string
          format: date-time
        message:
          type: string
    PublisherStatus:
      type: object
      additionalProperties: false
      required:
        - type
        - enabled
      properties:
        type:
          type: string
          enum: [wunderground, windy, mqtt]
        enabled:
          type: boolean
        lastPublishAt:
          type: string
          format: date-time
        lastResult:
          type: string
          enum: [unknown, success, failed]
        message:
          type: string
    DeviceConfigView:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - station
        - sampling
        - smoothing
        - storage
        - network
        - smsAdmin
        - webUi
        - sensors
        - publishers
      properties:
        schemaVersion:
          type: integer
          minimum: 1
        station:
          $ref: '#/components/schemas/StationConfig'
        sampling:
          $ref: '#/components/schemas/SamplingConfig'
        smoothing:
          $ref: '#/components/schemas/SmoothingConfig'
        storage:
          $ref: '#/components/schemas/StorageConfig'
        network:
          $ref: '#/components/schemas/NetworkConfig'
        smsAdmin:
          $ref: '#/components/schemas/SmsAdminConfig'
        webUi:
          $ref: '#/components/schemas/WebUiConfig'
        sensors:
          type: array
          items:
            $ref: '#/components/schemas/SensorConfig'
        publishers:
          $ref: '#/components/schemas/PublishersConfigView'
    StationConfig:
      type: object
      additionalProperties: false
      required:
        - stationName
        - locationFromGPS
        - gpsPollIntervalHours
      properties:
        stationName:
          type: string
        locationFromGPS:
          type: boolean
          description: When true, the device should use the latest valid GPS fix for station coordinates whenever GPS hardware and a valid fix are available.
        gpsPollIntervalHours:
          type: integer
          minimum: 1
          maximum: 24
          default: 6
          description: How often to wake and refresh the cached GPS fix used for station coordinates.
        location:
          $ref: '#/components/schemas/GeoLocation'
          description: Manual fallback coordinates used when GPS-based location is disabled or no valid GPS fix is available.
        notes:
          type: string
    GeoLocation:
      type: object
      additionalProperties: false
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        elevationMeters:
          type: number
    SamplingConfig:
      type: object
      additionalProperties: false
      required:
        - intervalSeconds
        - adminWindowMinutes
        - deepSleepEnabled
      properties:
        intervalSeconds:
          type: integer
          minimum: 2
          maximum: 20
          default: 2
        adminWindowMinutes:
          type: integer
          minimum: 1
          maximum: 60
          default: 10
        deepSleepEnabled:
          type: boolean
          default: true
        wakeDurationSeconds:
          type: integer
          minimum: 1
          maximum: 300
        historyAggregationMinutes:
          type: integer
          minimum: 5
          maximum: 1440
          default: 30
    SmoothingConfig:
      type: object
      additionalProperties: false
      required:
        - enabled
        - fields
      properties:
        enabled:
          type: boolean
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SmoothingFieldConfig'
    SmoothingFieldConfig:
      type: object
      additionalProperties: false
      required:
        - metric
        - method
      properties:
        metric:
          type: string
          enum:
            - windSpeed
            - windGust
            - windDirection
            - temperature
            - humidity
            - pressure
            - rainfall
            - illuminance
            - pm2_5
            - pm10
            - noise
        method:
          type: string
          enum: [none, moving_average, ema]
        windowSamples:
          type: integer
          minimum: 1
          maximum: 120
        alpha:
          type: number
          minimum: 0
          maximum: 1
    StorageConfig:
      type: object
      additionalProperties: false
      required:
        - retentionDays
        - logFormat
      properties:
        retentionDays:
          type: integer
          minimum: 1
          maximum: 30
          default: 14
        logFormat:
          type: string
          enum: [jsonl]
        configSource:
          type: string
          enum: [sd_with_flash_fallback]
    NetworkConfig:
      type: object
      additionalProperties: false
      required:
        - preferredTransport
        - wifi
        - cellular
      properties:
        preferredTransport:
          type: string
          enum: [wifi, cellular, auto]
        wifi:
          $ref: '#/components/schemas/WifiConfig'
        cellular:
          $ref: '#/components/schemas/CellularConfig'
    WifiConfig:
      type: object
      additionalProperties: false
      required:
        - enabled
        - ssid
      properties:
        enabled:
          type: boolean
        ssid:
          type: string
        password:
          type: string
          format: password
        passwordConfigured:
          type: boolean
        allowedOrigins:
          type: array
          items:
            type: string
#            format: uri
    CellularConfig:
      type: object
      additionalProperties: false
      required:
        - enabled
        - modemType
      properties:
        enabled:
          type: boolean
        modemType:
          type: string
          enum: [SIM7670G]
        apn:
          type: string
        pin:
          type: string
          format: password
        pinConfigured:
          type: boolean
        smsEnabled:
          type: boolean
    SmsAdminConfig:
      type: object
      additionalProperties: false
      required:
        - enabled
        - whitelist
      properties:
        enabled:
          type: boolean
        whitelist:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/PhoneWhitelistEntry'
    PhoneWhitelistEntry:
      type: object
      additionalProperties: false
      required:
        - label
        - phoneNumber
      properties:
        label:
          type: string
        phoneNumber:
          type: string
          description: E.164 formatted number
          examples: ['+919876543210']
    WebUiConfig:
      type: object
      additionalProperties: false
      required:
        - tokenTtlMinutes
        - allowedOrigins
      properties:
        tokenTtlMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 15
        allowedOrigins:
          type: array
          items:
            type: string
#            format: uri
    SensorConfig:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - enabled
      properties:
        id:
          type: string
        type:
          type: string
          enum: [sen0658, bme280, bmp390, lps22hb]
        enabled:
          type: boolean
        transport:
          type: string
          enum: [rs485_modbus, i2c, spi]
        pollIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 3600
        address:
          type: integer
          minimum: 1
          maximum: 247
    PublishersConfigView:
      type: object
      additionalProperties: false
      properties:
        wunderground:
          $ref: '#/components/schemas/WundergroundPublisherView'
        windy:
          $ref: '#/components/schemas/WindyPublisherView'
        mqtt:
          $ref: '#/components/schemas/MqttPublisherView'
    PublishersConfigInput:
      type: object
      additionalProperties: false
      properties:
        wunderground:
          $ref: '#/components/schemas/WundergroundPublisherInput'
        windy:
          $ref: '#/components/schemas/WindyPublisherInput'
        mqtt:
          $ref: '#/components/schemas/MqttPublisherInput'
    PublisherBaseView:
      type: object
      additionalProperties: false
      required:
        - type
        - enabled
        - publishIntervalSeconds
      properties:
        type:
          type: string
        enabled:
          type: boolean
        publishIntervalSeconds:
          type: integer
          minimum: 30
          maximum: 300
        includeHistoryWindowMinutes:
          type: integer
          minimum: 1
          maximum: 1440
    PublisherBaseInput:
      type: object
      additionalProperties: false
      required:
        - type
        - enabled
        - publishIntervalSeconds
      properties:
        type:
          type: string
        enabled:
          type: boolean
        publishIntervalSeconds:
          type: integer
          minimum: 30
          maximum: 300
        includeHistoryWindowMinutes:
          type: integer
          minimum: 1
          maximum: 1440
    WundergroundPublisherView:
      allOf:
        - $ref: '#/components/schemas/PublisherBaseView'
        - type: object
          required:
            - type
            - stationId
            - apiKeyConfigured
          properties:
            type:
              type: string
              const: wunderground
            stationId:
              type: string
            apiKeyConfigured:
              type: boolean
    WundergroundPublisherInput:
      allOf:
        - $ref: '#/components/schemas/PublisherBaseInput'
        - type: object
          required:
            - type
            - stationId
          properties:
            type:
              type: string
              const: wunderground
            stationId:
              type: string
            apiKey:
              type: string
    WindyPublisherView:
      allOf:
        - $ref: '#/components/schemas/PublisherBaseView'
        - type: object
          required:
            - type
            - stationId
            - apiKeyConfigured
          properties:
            type:
              type: string
              const: windy
            stationId:
              type: string
            apiKeyConfigured:
              type: boolean
    WindyPublisherInput:
      allOf:
        - $ref: '#/components/schemas/PublisherBaseInput'
        - type: object
          required:
            - type
            - stationId
          properties:
            type:
              type: string
              const: windy
            stationId:
              type: string
            apiKey:
              type: string
    MqttPublisherView:
      allOf:
        - $ref: '#/components/schemas/PublisherBaseView'
        - type: object
          required:
            - type
            - brokerUrl
            - topic
            - username
            - passwordConfigured
          properties:
            type:
              type: string
              const: mqtt
            brokerUrl:
              type: string
#              format: uri
            topic:
              type: string
            username:
              type: string
            passwordConfigured:
              type: boolean
    MqttPublisherInput:
      allOf:
        - $ref: '#/components/schemas/PublisherBaseInput'
        - type: object
          required:
            - type
            - brokerUrl
            - topic
            - username
          properties:
            type:
              type: string
              const: mqtt
            brokerUrl:
              type: string
#              format: uri
            topic:
              type: string
            username:
              type: string
            password:
              type: string
    LatestSensorReadingsResponse:
      type: object
      additionalProperties: false
      required:
        - latest
        - smoothed
      properties:
        latest:
          $ref: '#/components/schemas/WeatherSample'
        smoothed:
          $ref: '#/components/schemas/SmoothedWeatherSample'
    WeatherHistoryResponse:
      type: object
      additionalProperties: false
      required:
        - samples
      properties:
        samples:
          type: array
          items:
            $ref: '#/components/schemas/WeatherSample'
    WeatherSample:
      type: object
      additionalProperties: false
      required:
        - recordedAt
      properties:
        recordedAt:
          type: string
          format: date-time
        temperatureC:
          type: number
        humidityPct:
          type: number
        pressureHpa:
          type: number
        windSpeedMps:
          type: number
        windGustMps:
          type: number
        windDirectionDeg:
          type: number
        rainfallMm:
          type: number
        illuminanceLux:
          type: number
        pm2_5UgM3:
          type: number
        pm10UgM3:
          type: number
        noiseDb:
          type: number
    SmoothedWeatherSample:
      allOf:
        - $ref: '#/components/schemas/WeatherSample'
        - type: object
          properties:
            smoothingApplied:
              type: boolean
paths:
  /api/v1/status:
    get:
      tags: [status]
      operationId: getStatus
      security:
        - bearerAuth: []
      summary: Get overall device health and connectivity status
      responses:
        '200':
          description: Current device status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusResponse'
  /api/v1/config/station:
    get:
      tags: [config]
      operationId: getStationConfig
      security:
        - bearerAuth: []
      summary: Get station configuration
      responses:
        '200':
          description: Current station configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationConfig'
    put:
      tags: [config]
      operationId: updateStationConfig
      security:
        - bearerAuth: []
      summary: Update station configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationConfig'
      responses:
        '200':
          description: Updated station configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationConfig'
        '400':
          description: Configuration validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/config/sampling:
    get:
      tags: [config]
      operationId: getSamplingConfig
      security:
        - bearerAuth: []
      summary: Get sampling configuration
      responses:
        '200':
          description: Current sampling configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamplingConfig'
    put:
      tags: [config]
      operationId: updateSamplingConfig
      security:
        - bearerAuth: []
      summary: Update sampling configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SamplingConfig'
      responses:
        '200':
          description: Updated sampling configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamplingConfig'
        '400':
          description: Configuration validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/config/smoothing:
    get:
      tags: [config]
      operationId: getSmoothingConfig
      security:
        - bearerAuth: []
      summary: Get smoothing configuration
      responses:
        '200':
          description: Current smoothing configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmoothingConfig'
    put:
      tags: [config]
      operationId: updateSmoothingConfig
      security:
        - bearerAuth: []
      summary: Update smoothing configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmoothingConfig'
      responses:
        '200':
          description: Updated smoothing configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmoothingConfig'
        '400':
          description: Configuration validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/config/storage:
    get:
      tags: [config]
      operationId: getStorageConfig
      security:
        - bearerAuth: []
      summary: Get storage configuration
      responses:
        '200':
          description: Current storage configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageConfig'
    put:
      tags: [config]
      operationId: updateStorageConfig
      security:
        - bearerAuth: []
      summary: Update storage configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageConfig'
      responses:
        '200':
          description: Updated storage configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageConfig'
        '400':
          description: Configuration validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/config/network:
    get:
      tags: [config]
      operationId: getNetworkConfig
      security:
        - bearerAuth: []
      summary: Get network configuration
      responses:
        '200':
          description: Current network configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkConfig'
    put:
      tags: [config]
      operationId: updateNetworkConfig
      security:
        - bearerAuth: []
      summary: Update network configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetworkConfig'
      responses:
        '200':
          description: Updated network configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkConfig'
        '400':
          description: Configuration validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/config/sms-admin:
    get:
      tags: [config]
      operationId: getSmsAdminConfig
      security:
        - bearerAuth: []
      summary: Get SMS admin configuration
      responses:
        '200':
          description: Current SMS admin configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsAdminConfig'
    put:
      tags: [config]
      operationId: updateSmsAdminConfig
      security:
        - bearerAuth: []
      summary: Update SMS admin configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsAdminConfig'
      responses:
        '200':
          description: Updated SMS admin configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsAdminConfig'
        '400':
          description: Configuration validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/config/web-ui:
    get:
      tags: [config]
      operationId: getWebUiConfig
      security:
        - bearerAuth: []
      summary: Get web UI configuration
      responses:
        '200':
          description: Current web UI configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUiConfig'
    put:
      tags: [config]
      operationId: updateWebUiConfig
      security:
        - bearerAuth: []
      summary: Update web UI configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebUiConfig'
      responses:
        '200':
          description: Updated web UI configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebUiConfig'
        '400':
          description: Configuration validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/config/sensors:
    get:
      tags: [config]
      operationId: getSensorsConfig
      security:
        - bearerAuth: []
      summary: Get sensor configuration
      responses:
        '200':
          description: Current sensor configuration
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SensorConfig'
    put:
      tags: [config]
      operationId: updateSensorsConfig
      security:
        - bearerAuth: []
      summary: Update sensor configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SensorConfig'
      responses:
        '200':
          description: Updated sensor configuration
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SensorConfig'
        '400':
          description: Configuration validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/config/publishers/wunderground:
    get:
      tags: [config]
      operationId: getWundergroundPublisherConfig
      security:
        - bearerAuth: []
      summary: Get Weather Underground publisher configuration
      responses:
        '200':
          description: Current Weather Underground publisher configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WundergroundPublisherView'
    put:
      tags: [config]
      operationId: updateWundergroundPublisherConfig
      security:
        - bearerAuth: []
      summary: Update Weather Underground publisher configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WundergroundPublisherInput'
      responses:
        '200':
